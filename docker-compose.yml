services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geartrack}
      POSTGRES_USER: ${POSTGRES_USER:-geartrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geartrack_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-geartrack}:${POSTGRES_PASSWORD:-geartrack_dev}@db:5432/${POSTGRES_DB:-geartrack}
      PORT: 3000
      WEAR_TRAIL_FACTOR: ${WEAR_TRAIL_FACTOR:-1.25}
      WEAR_ELEVATION_FACTOR_PER_100M: ${WEAR_ELEVATION_FACTOR_PER_100M:-0.03}
    ports:
      - "${API_PORT:-8001}:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
