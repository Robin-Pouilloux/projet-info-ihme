name: Construire et publier l’image

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      deploy:
        description: Déployer cette version après construction
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - name: Vérifier le chemin attribué
        env:
          BASE_PATH: ${{ vars.IHME_BASE_PATH }}
        run: |
          if [[ ! "$BASE_PATH" =~ ^(/[a-zA-Z0-9._-]+)+/$ ]]; then
            echo "Configurez IHME_BASE_PATH avec le chemin attribué, terminé par /." >&2
            exit 1
          fi
      - name: Tester le frontend
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
      - name: Tester le backend Express
        run: |
          npm ci --prefix backend
          npm test --prefix backend
      - name: Nom de l’image
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construire et publier
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
          build-args: |
            BASE_PATH=${{ vars.IHME_BASE_PATH }}
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Résumé de la version
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf '### Image GearTrack prête

          Commit : `%s`

          Image : `%s@%s`

          Le push publie l’image ; le serveur n’est modifié que par un lancement manuel avec « Déployer ».
          ' "$GITHUB_SHA" "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Déployer sur le serveur du cours
        if: github.event_name == 'workflow_dispatch' && inputs.deploy
        env:
          DEPLOY_URL: ${{ vars.IHME_DEPLOY_URL }}
          DEPLOY_TOKEN: ${{ secrets.IHME_DEPLOY_TOKEN }}
        run: python3 deploy/request.py
