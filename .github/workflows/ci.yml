name: Vérifications GearTrack

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - name: Installer et construire le frontend
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
      - name: Installer et tester le backend Express
        run: |
          npm ci --prefix backend
          npm test --prefix backend
      - name: Construire l’image de déploiement
        run: docker build --build-arg BASE_PATH=/projet-info-ihme/ -t geartrack:ci .
